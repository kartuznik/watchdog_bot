apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram-owner
    receivers:
      - uid: telegram-owner-receiver
        type: telegram
        settings:
          bottoken: $__env{TELEGRAM_BOT_TOKEN}
          chatid: $__env{TELEGRAM_ALERT_CHAT_ID}
          message: |
            {{ range .Alerts }}
            🚨 *{{ .Labels.alertname }}*

            🔴 Severity: *{{ .Labels.severity }}*
            📝 {{ .Annotations.summary }}
            {{ if .Annotations.description }}🔍 {{ .Annotations.description }}{{ end }}
            ⏰ Starts: {{ .StartsAt.Format "02.01.2006 15:04:05" }}
            {{ if eq .Status "resolved" }}✅ Resolved: {{ .EndsAt.Format "02.01.2006 15:04:05" }}{{ end }}

            {{ end }}
            {{ if eq .Status "firing" }}🔥 Status: FIRING{{ else }}✅ Status: RESOLVED{{ end }}
          parse_mode: "Markdown"
          disable_web_page_preview: true
          protect_content: false
